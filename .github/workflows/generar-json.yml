name: Generar Lista de Imagenes Automaticamente

on:
  push:
    paths:
      - 'img/**'
  workflow_dispatch: # Te permite ejecutarlo manualmente desde la pestaña Actions si lo necesitas

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Generar archivo imagenes.json
      run: |
        # Busca archivos dentro de img/, extrae su nombre y crea un array JSON válido
        find img -maxdepth 1 -type f ! -name '.*' -printf '%f\n' | sort | jq -R . | jq -s . > imagenes.json

    - name: Subir cambios automaticamente a GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add imagenes.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Bot: imagenes.json actualizado automaticamente" && git push)
